      function Button() {
        const [isButtonOn, setIsButtonOn] = React.useState(true)

        function switchButtonOn() {
          if(isButtonOn) {
            setIsButtonOn(false);
          }else {
            setIsButtonOn(true);
          }
        }
        return (
        <button className={isButtonOn ? 'on-button' : 'off-button'} onClick={switchButtonOn}>{isButtonOn ? 'ON' : 'OFF'}</button>
        );
      }

      
      const container = document.querySelector('.js-button')
      ReactDOM.createRoot(container).render(<Button />);
